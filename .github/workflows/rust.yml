name: Rust Android Build

on:
  push:
    branches: ["ruby", "main"]
  pull_request:
    branches: ["ruby", "main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  ANDROID_NDK_VERSION: r28c

jobs:
  build-android:
    name: Rust Android Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust target for Android
      run: rustup target add aarch64-linux-android

    - name: Cache Android NDK
      id: cache
      uses: actions/cache@v4
      with:
        path: .android-ndk
        key: ndk-${{ env.ANDROID_NDK_VERSION }}

    - name: Download Android NDK if cache missed
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y unzip wget
        wget https://dl.google.com/android/repository/android-ndk-${ANDROID_NDK_VERSION}-linux.zip -O ndk.zip
        unzip -q ndk.zip -d .
        mv android-ndk-${ANDROID_NDK_VERSION} .android-ndk

    - name: Configure Cargo linker for aarch64
      run: |
        mkdir -p .cargo
        cat > .cargo/config.toml <<EOF
        [target.aarch64-linux-android]
        linker = "${{ github.workspace }}/.android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang"
        rustflags = ["-C", "link-arg=--sysroot=${{ github.workspace }}/.android-ndk/toolchains/llvm/prebuilt/linux-x86_64/sysroot", "-C", "link-arg=-llog"]
        EOF

    - name: Build release for Android
      run: cargo build --release --target aarch64-linux-android

    - name: Strip binary
      run: |
        ${{ github.workspace }}/.android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip \
          target/aarch64-linux-android/release/vibrator-service

    - name: Prepare release folder
      run: |
        mkdir -p release/vendor/bin/hw
        mkdir -p release/vendor/etc/init
        mkdir -p release/vendor/etc/vintf/manifest
        mkdir -p release/sepolicy
        cp target/aarch64-linux-android/release/vibrator-service \
          release/vendor/bin/hw/vendor.xiaomi.hardware.vibratorfeature.service
        cp packaging/ruby/vendor/etc/init/vendor.xiaomi.hardware.vibratorfeature.service.rc \
          release/vendor/etc/init/
        cp packaging/ruby/vendor/etc/vintf/manifest/vendor.xiaomi.hardware.vibratorfeature.service.xml \
          release/vendor/etc/vintf/manifest/
        cp packaging/ruby/sepolicy/sysfs_haptics.cil release/sepolicy/
        cp packaging/ruby/fs_config.add release/
        cp packaging/ruby/remove.txt release/
        cp packaging/ruby/README.md release/README-ruby.md
        cp LICENSE README.md release/
        sha256sum release/vendor/bin/hw/vendor.xiaomi.hardware.vibratorfeature.service \
          > release/SHA256SUMS

    - name: Upload release folder as artifact
      uses: actions/upload-artifact@v4
      with:
        name: ruby-vibratorfeature-aidl
        path: release

    - name: Send HAL binary to Telegram
      if: ${{ github.event_name != 'pull_request' }}
      env:
        BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        COMMIT_SHA: ${{ github.sha }}
        RUN_NUMBER: ${{ github.run_number }}
        SERVER_URL: ${{ github.server_url }}
        REPOSITORY: ${{ github.repository }}
      run: |
        BIN=release/vendor/bin/hw/vendor.xiaomi.hardware.vibratorfeature.service
        if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
          echo "::warning::TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID secrets are not set, skipping Telegram upload"
          exit 0
        fi
        if [ ! -f "$BIN" ]; then
          echo "::error::$BIN not found"
          exit 1
        fi

        api="https://api.telegram.org/bot${BOT_TOKEN}"
        name=$(basename "$BIN")
        size=$(stat -c%s "$BIN")
        size_mb=$(awk -v b="$size" 'BEGIN { printf "%.3f", b / 1048576 }')
        sha=$(sha256sum "$BIN" | cut -d' ' -f1)
        sha_short=$(echo "$sha" | cut -c 1-12)
        short_commit=$(echo "$COMMIT_SHA" | cut -c 1-7)
        run_url="${SERVER_URL}/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

        header=$(printf '<b>ruby vibrator HAL</b>\n\n<b>File:</b> <code>%s</code>\n<b>Size:</b> %s MB (%s bytes)\n<b>SHA-256:</b> <code>%s</code>\n<b>Commit:</b> <code>%s</code>\n<b>Run:</b> #%s\n\nVendor binary, not a flashable zip.' \
          "$name" "$size_mb" "$size" "$sha" "$short_commit" "$RUN_NUMBER")

        curl -sS --fail -X POST "${api}/sendMessage" \
          -d chat_id="${CHAT_ID}" \
          -d parse_mode="HTML" \
          -d disable_web_page_preview="true" \
          --data-urlencode text="${header}"
        echo

        caption=$(printf '<b>%s</b>\n%s MB\nSHA-256: <code>%s</code>\n<code>%s</code>' \
          "$name" "$size_mb" "$sha_short" "$run_url")
        curl -sS --fail -F document=@"$BIN" \
          -F chat_id="${CHAT_ID}" \
          -F parse_mode="HTML" \
          -F caption="$caption" \
          "${api}/sendDocument"
        echo
